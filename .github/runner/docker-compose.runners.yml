# Flota de runners self-hosted de BotaBien. Uso (desde este directorio):
#
#   Levantar (la primera vez exporta los tokens de registro, ver README.md):
#     docker compose -f docker-compose.runners.yml up -d --build
#   Tumbar (los runners quedan "offline" en GitHub; la config persiste):
#     docker compose -f docker-compose.runners.yml down
#
# Dimensionado (corregido tras incidente del 07/08, madrugada): un pipeline
# completo en frío necesita ~6-7 GB; con tope de 5 GB el contenedor moría por
# OOM a mitad de job (síntoma: job en failure SIN ningún paso fallido). Por
# defecto corre SOLO runner-1 con 8 GB; runner-2 (perfil "ola", 4 GB) se
# activa únicamente en olas de PRs y con la VM vigilada:
#   docker compose -f docker-compose.runners.yml --profile ola up -d
# El heap de Gradle va limitado a 3g desde el gradle.properties del volumen
# de caché (lo escribe entrypoint.sh).
services:
  runner-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: botabien/actions-runner:2.336.0
    container_name: botabien-runner-1
    restart: unless-stopped
    environment:
      RUNNER_NAME: botabien-runner-1
      RUNNER_LABELS: self-hosted,linux,docker,botabien
      RUNNER_TOKEN: ${RUNNER_TOKEN_1:-}
      GRADLE_USER_HOME: /opt/gradle-cache
    volumes:
      - runner1-agent:/opt/actions-runner
      - runner1-gradle-cache:/opt/gradle-cache
    mem_limit: 8g
    cpus: 4

  # Segundo ejecutor SOLO para olas de PRs (perfil "ola"): con 4 GB aguanta
  # builds con caché caliente, no un pipeline frío.
  runner-2:
    image: botabien/actions-runner:2.336.0
    container_name: botabien-runner-2
    restart: unless-stopped
    profiles: ["ola"]
    depends_on:
      - runner-1
    environment:
      RUNNER_NAME: botabien-runner-2
      RUNNER_LABELS: self-hosted,linux,docker,botabien
      RUNNER_TOKEN: ${RUNNER_TOKEN_2:-}
      GRADLE_USER_HOME: /opt/gradle-cache
    volumes:
      - runner2-agent:/opt/actions-runner
      - runner2-gradle-cache:/opt/gradle-cache
    mem_limit: 4g
    cpus: 2

volumes:
  runner1-agent:
  runner1-gradle-cache:
  runner2-agent:
  runner2-gradle-cache:
