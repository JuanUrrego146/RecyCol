# Respaldo hospedado del CI (QA). Se lanza a mano cuando los runners propios
# están caídos:  gh workflow run ci-respaldo.yml --ref <rama>
# Produce el mismo check «Compilar y probar», así que satisface la protección
# de rama exactamente igual que el CI principal.
name: CI respaldo (hospedado)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pruebas de shared (multiplataforma)
        run: ./gradlew :shared:allTests :shared:testing:allTests --stacktrace

      - name: Verificar aislamiento de plataforma en shared
        run: ./gradlew :shared:verifyPlatformIsolation --stacktrace

      - name: Pruebas unitarias de androidApp e inference
        run: ./gradlew :androidApp:testDebugUnitTest :androidApp:inference:testDebugUnitTest --stacktrace

      - name: Compilar androidApp (debug)
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Publicar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: botabien-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
